stages:
  - build
  - release


linux:
  stage: build
  image: python:3.12

  script:
    - pip install -r requirements.txt
    - pip install pyinstaller
    - pyinstaller --onefile scraper.py
    - mv dist/scraper dist/scraper-linux

  artifacts:
    paths:
      - dist/scraper-linux


windows:
  stage: build
  tags:
    - windows

  script:
    - py -m pip install -r requirements.txt
    - py -m pip install pyinstaller
    - pyinstaller --onefile scraper.py
    - move dist\scraper.exe dist\scraper-windows.exe

  artifacts:
    paths:
      - dist/scraper-windows.exe


release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - linux
    - windows

  script:
    - echo "Creating release"

  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Scraper $CI_COMMIT_TAG"
    assets:
      links:
        - name: "scraper-linux"
          url: "${CI_PROJECT_URL}/-/jobs/${LINUX_JOB_ID}/artifacts/raw/dist/scraper-linux"
        - name: "scraper-windows.exe"
          url: "${CI_PROJECT_URL}/-/jobs/${WINDOWS_JOB_ID}/artifacts/raw/dist/scraper-windows.exe"

  rules:
    - if: $CI_COMMIT_TAG