stages:
  - build
  - release


linux:
  stage: build
  tags:
    - saas-linux-medium-amd64

  image: python:3.12

  script:
    - pip install -r requirements.txt
    - pip install pyinstaller
    - pyinstaller --onefile --name scraper src/main.py

  artifacts:
    paths:
      - dist/scraper
    expire_in: 1 week


windows:
  stage: build
  tags:
    - saas-windows-medium-amd64

  script:
    - py -m pip install -r requirements.txt
    - py -m pip install pyinstaller
    - pyinstaller --onefile --name scraper src/main.py

  artifacts:
    paths:
      - dist/scraper.exe
    expire_in: 1 week


release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest

  needs:
    - job: linux
      artifacts: true
    - job: windows
      artifacts: true

  script:
    - echo "Creating release $CI_COMMIT_TAG"

  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Scraper $CI_COMMIT_TAG"
    assets:
      links:
        - name: "scraper-linux"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/scraper?job=linux"
          link_type: "package"
        - name: "scraper-windows.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/scraper.exe?job=windows"
          link_type: "package"

  rules:
    - if: $CI_COMMIT_TAG